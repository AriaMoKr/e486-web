[sdl]
windowresolution = 1280x800
output = default

[render]
aspect = true
scaler = normal2x

[cpu]
core = auto
cputype = 486_slow
cycles = 25000

[serial]
serial1 = nullmodem server:127.0.0.1 port:5000 rxdelay:0

[autoexec]
@echo off
mount c bin
c:
cls
echo ========================================================
echo   Launching DOS AI Chatbot...
echo   Connected to AI Gateway on COM1 (115200 baud)
echo ========================================================
aichat.exe
